[package]
name = "swifttunnel-macos-sdk"
version = "1.3.0"
edition = "2021"
authors = ["SwiftTunnel <support@swifttunnel.net>"]
description = "SwiftTunnel macOS SDK - V3 relay with transparent proxy split tunneling and built-in auth"

[lib]
crate-type = ["cdylib"]
name = "swifttunnel"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = "3"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tiny_http = "0.12"
crossbeam-channel = "0.5"
arc-swap = "1.7"
parking_lot = "0.12"
dirs = "5.0"
once_cell = "1.19"
url = "2"

[build-dependencies]
cbindgen = "0.27"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
